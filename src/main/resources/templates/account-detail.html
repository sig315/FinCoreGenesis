<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>口座詳細</title>
</head>

<body>

<h1>口座詳細</h1>

<p>
    ID：
    <span th:text="${account.id}"></span>
</p>

<p>
    口座番号：
    <span th:text="${account.accountNumber}"></span>
</p>

<p>
    口座名義：
    <span th:text="${account.accountName}"></span>
</p>

<p>
    残高：
    <span th:text="${account.balance}"></span>
</p>

<p>
    登録日時：
    <span th:text="${account.createdAt}"></span>
</p>

<a th:href="@{/accounts}">口座一覧へ戻る</a>

<br>

<a th:href="@{/}">トップへ戻る</a>

</body>

</html>
