<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー登録</title>
</head>
<body>

<h1> ユーザー登録</h1>

<form action="/users/register" method="post">

    <label>ユーザー名</label>
    <input type="text" id="username" name="username">
    <div th:if="${#fields.hasErrors('username')}"
         th:errors="*{username}">
    </div>

    <br><br>

    <label>パスワード</label>
    <input type="password" id="password" name="password">

    <br><br>

    <button type="submit">登録</button>

</form>

</body>
</html>
