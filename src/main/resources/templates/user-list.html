<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー一覧</title>
</head>
<body>

<h1>ユーザー一覧</h1>

<table border="1">

    <tr>
        <th>ID</th>
        <th>ユーザー名</th>
        <th>操作</th>
    </tr>

    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td>
            <a th:href="@{/users/{id}(id=${user.id})}">詳細</a>

            <form th:action="@{/users/{id}/delete(id=${user.id})}"
                  method="post"
                  style="display:inline;">
                <button type="submit">削除</button>
            </form>
        </td>
    </tr>

</table>

</body>
</html>
