<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>口座登録</title>
</head>

<body>

<h1>口座登録</h1>

<form th:action="@{/accounts/register}" th:object="${account}" method="post">

    <div>
        <label>口座番号</label>
        <input type="text" th:field="*{accountNumber}">
        <p th:if="${#fields.hasErrors('accountNumber')}"
           th:errors="*{accountNumber}"></p>
    </div>

    <div>
        <label>口座名義</label>
        <input type="text" th:field="*{accountName}">
        <p th:if="${#fields.hasErrors('accountName')}"
           th:errors="*{accountName}"></p>
    </div>

    <div>
        <label>初期残高</label>
        <input type="number" step="0.01" th:field="*{balance}">
        <p th:if="${#fields.hasErrors('balance')}"
           th:errors="*{balance}"></p>
    </div>

    <button type="submit">登録</button>

</form>

<a th:href="@{/}">トップへ戻る</a>

</body>

</html>
