<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー編集</title>
</head>
<body>

<h1>ユーザー編集</h1>

<form th:action="@{/users/{id}/edit(id=${user.id})}"
      method="post"
      th:object="${user}">

    <label for="username">ユーザー名</label>
    <input type="text"
           id="username"
           name="username"
           th:field="*{username}">

    <div th:if="${#fields.hasErrors('username')}"
         th:errors="*{username}">
    </div>

    <br><br>

    <label for="password">パスワード</label>
    <input type="password"
           id="password"
           name="password"
           th:field="*{password}">

    <div th:if="${#fields.hasErrors('password')}"
         th:errors="*{password}">
    </div>

    <br><br>

    <button type="submit">更新</button>

</form>

</body>
</html>
