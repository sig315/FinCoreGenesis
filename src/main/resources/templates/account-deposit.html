<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>入金</title>
</head>

<body>

<h1>入金</h1>

<p th:if="${errorMessage}" th:text="${errorMessage}"></p>

<p>
    口座番号：
    <span th:text="${account.accountNumber}"></span>
</p>

<p>
    口座名義：
    <span th:text="${account.accountName}"></span>
</p>

<p>
    現在残高：
    <span th:text="${account.balance}"></span>
</p>

<form th:action="@{/accounts/{id}/deposit(id=${account.id})}" method="post">

    <label>入金額</label>

    <input type="number"
           name="amount"
           min="1"
           step="0.01"
           required>

    <button type="submit">入金する</button>

</form>

<br>

<a th:href="@{/accounts/{id}(id=${account.id})}">
    口座詳細へ戻る
</a>

<br>

<a th:href="@{/accounts}">
    口座一覧へ戻る
</a>

</body>

</html>
