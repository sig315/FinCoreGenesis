<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>口座一覧</title>
</head>

<body>

<h1>口座一覧</h1>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>口座番号</th>
        <th>口座名義</th>
        <th>残高</th>
        <th>登録日時</th>
        <th>詳細</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="account : ${accounts}">

        <td th:text="${account.id}"></td>

        <td th:text="${account.accountNumber}"></td>

        <td th:text="${account.accountName}"></td>

        <td th:text="${account.balance}"></td>

        <td th:text="${account.createdAt}"></td>

        <td>
            <a th:href="@{/accounts/{id}(id=${account.id})}">
                詳細
            </a>
        </td>

    </tr>
    </tbody>

</table>

<br>

<a th:href="@{/accounts/register}">口座を登録する</a>

<br>

<a th:href="@{/}">トップへ戻る</a>

</body>

</html>
